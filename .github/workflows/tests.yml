name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # First, because it validates the very file that defines what the later
      # steps run: duplicate scripts keys once let `npm test` go green while
      # silently skipping two suites (see scripts/validate-package.mjs).
      - name: Validate package.json
        run: npm run validate:pkg

      - name: Unit / security / validation / golden tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency audit (block on critical)
        run: |
          attempt=1
          max_attempts=3
          until npm audit --audit-level=critical; do
            exit_code=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "npm audit failed after $max_attempts attempts (exit $exit_code)."
              exit "$exit_code"
            fi
            echo "npm audit attempt $attempt/$max_attempts failed (exit $exit_code) — retrying in 15s (likely a transient registry issue, e.g. npmjs.org audit endpoint 503)..."
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Dependency audit (full report, non-blocking)
        run: npm audit || true

      - name: Production build
        run: npm run build

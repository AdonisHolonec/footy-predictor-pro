name: E2E Smoke

# Promoted to a required branch-protection check (2026-08-09) after running
# quietly since its introduction; the pull_request trigger exists so the check
# can gate merges. Fork PRs would run without secrets and skip the credentialed
# specs, but this repo takes no fork contributions today.
#
# Runs against production (the deployed default in playwright.config.ts)
# because preview deployments sit behind Vercel deployment protection. The
# smoke is read-mostly by design: predict hits the warm cache, billing stops
# at the checkout-session response and never completes a payment.
# Serialised on purpose. The suite logs into shared test accounts, and Supabase
# rate-limits password logins per account — so two overlapping runs spend double
# the login budget and can take the account red for 30-60 minutes. That is not
# hypothetical: on 2026-08-10 a main-push run and a PR run started 12 seconds
# apart and together tripped the limit. Queue instead of overlapping.
concurrency:
  group: e2e-smoke
  cancel-in-progress: false

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Dedicated account for the logout journey — its signOut is global and
          # would otherwise revoke the sessions every other spec runs on.
          E2E_LOGOUT_EMAIL: ${{ secrets.E2E_LOGOUT_EMAIL }}
          E2E_LOGOUT_PASSWORD: ${{ secrets.E2E_LOGOUT_PASSWORD }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

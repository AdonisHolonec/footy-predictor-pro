name: E2E Smoke

# A POST-MERGE PRODUCTION SMOKE, not a PR gate. It runs against production (the
# deployed default in playwright.config.ts) because preview deployments sit
# behind Vercel deployment protection — so a run on a pull request never
# exercised that PR's code. It could not fail because of the diff and could not
# vouch for it; it only doubled the load.
#
# That load is the constraint. Each run performs ~3 password logins, Supabase
# rate-limits them, and the limit appears to be project-wide rather than
# per-account: on 2026-08-10 the free-tier and admin setups failed together,
# minutes after a clean run. Two runs per merge is what kept pushing us over.
# Dropped the pull_request trigger on 2026-08-10 and removed `smoke` from the
# required checks; `test` still gates every PR.
#
# The smoke stays read-mostly by design: predict hits the warm cache, billing
# stops at the checkout-session response and never completes a payment.

# One smoke at a time: each run performs ~3 password logins and Supabase
# rate-limits them project-wide, so two concurrent runs fail each other.
#
# `cancel-in-progress: true` because this smoke targets PRODUCTION, not the
# commit's own build. A queued run for an older SHA would test whatever
# production has since become, so only the newest run carries information and
# superseding an older one loses nothing. Under `false`, GitHub keeps a single
# pending slot and each new push cancelled the previously queued run — so one
# stalled run meant the newest commit was never smoked at all. That is how
# 2026-08-19 lost the smoke for five consecutive merges (#100 through #104).
concurrency:
  group: e2e-smoke
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A green smoke takes ~4m30s. Without this the job inherits GitHub's 6-hour
    # default, and on 2026-08-19 one that hung on the browser install held the
    # concurrency group for 6h 0m 55s before the platform killed it — blocking
    # every merge behind it. The cap is what makes a stall self-healing.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is what stalled on 2026-08-19. Cached, a hit skips
      # it entirely and only the system-deps install remains; the key is the
      # lockfile, so a Playwright version bump invalidates it on its own.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # Normally well under a minute. Failing here is recoverable — a stall
        # that eats the job budget is not.
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Dedicated account for the logout journey — its signOut is global and
          # would otherwise revoke the sessions every other spec runs on.
          E2E_LOGOUT_EMAIL: ${{ secrets.E2E_LOGOUT_EMAIL }}
          E2E_LOGOUT_PASSWORD: ${{ secrets.E2E_LOGOUT_PASSWORD }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

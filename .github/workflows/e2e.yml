name: E2E Smoke

# A POST-MERGE PRODUCTION SMOKE, not a PR gate. It runs against production (the
# deployed default in playwright.config.ts) because preview deployments sit
# behind Vercel deployment protection — so a run on a pull request never
# exercised that PR's code. It could not fail because of the diff and could not
# vouch for it; it only doubled the load.
#
# That load is the constraint. Each run performs ~3 password logins, Supabase
# rate-limits them, and the limit appears to be project-wide rather than
# per-account: on 2026-08-10 the free-tier and admin setups failed together,
# minutes after a clean run. Two runs per merge is what kept pushing us over.
# Dropped the pull_request trigger on 2026-08-10 and removed `smoke` from the
# required checks; `test` still gates every PR.
#
# The smoke stays read-mostly by design: predict hits the warm cache, billing
# stops at the checkout-session response and never completes a payment.
concurrency:
  group: e2e-smoke
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Dedicated account for the logout journey — its signOut is global and
          # would otherwise revoke the sessions every other spec runs on.
          E2E_LOGOUT_EMAIL: ${{ secrets.E2E_LOGOUT_EMAIL }}
          E2E_LOGOUT_PASSWORD: ${{ secrets.E2E_LOGOUT_PASSWORD }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: npx playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
